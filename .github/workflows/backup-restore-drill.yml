name: Backup Restore Drill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backup-restore-drill.yml"
      - "scripts/restore-production-backup.sh"
      - "scripts/record-protection-run.sh"
      - "supabase/tests/production_bundle_restore.sql"
  schedule:
    - cron: "43 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backup-restore-drill
  cancel-in-progress: false

env:
  BACKUP_AWS_CLI_IMAGE: amazon/aws-cli:2.36.30
  BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
  BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
  BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
  BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX || 'production/postgres' }}
  SUPABASE_CLI_VERSION: "2.111.0"
  SUPABASE_PROJECT_REF: fhbvwyttikrbeaanatlr
  SUPABASE_POSTGRES_VERSION: "17.6.1.141"
  SUPABASE_STORAGE_VERSION: "v1.70.7"
  SUPABASE_STORAGE_REQUIRED_MIGRATION: "64"
  PROTECTION_EXECUTION_REFERENCE: github-actions:backup-restore-drill:${{ github.run_id }}:${{ github.run_attempt }}
  PROTECTION_TYPE: restore_drill
  PROTECTION_COVERAGE: postgres
  PROTECTION_PROVIDER: cloudflare_r2
  PROTECTION_DESTINATION: isolated_supabase_postgres_restore

jobs:
  drill:
    if: ${{ vars.BACKUP_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.BACKUP_S3_SESSION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate required drill configuration
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_DB_URL BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required backup drill configuration for ${name} is not configured."
              missing=1
            fi
          done
          if (( missing != 0 )); then
            exit 1
          fi

          if [[ "${SUPABASE_DB_URL}" != *".pooler.supabase.com:5432/"* ]]; then
            echo "::error::PRODUCTION_SUPABASE_DB_URL must use the Supabase Session pooler on port 5432."
            exit 1
          fi

          if [[ "${BACKUP_S3_ENDPOINT}" != https://* ]]; then
            echo "::error::BACKUP_S3_ENDPOINT must use HTTPS."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify restore tooling
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          bash scripts/s3-backup-storage.sh check-tooling
          bash -n scripts/restore-production-backup.sh scripts/record-protection-run.sh

      - name: Begin authoritative restore drill
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: bash scripts/record-protection-run.sh start

      - name: Download and verify latest real off-site backup
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          DRILL_DIR="${RUNNER_TEMP}/lojasaph-backup-drill"
          rm -rf "${DRILL_DIR}"
          install -d -m 700 "${DRILL_DIR}/download" "${DRILL_DIR}/extracted"

          ARCHIVE_NAME="$(
            bash scripts/s3-backup-storage.sh download-latest "${DRILL_DIR}/download"
          )"
          MANIFEST_NAME="${ARCHIVE_NAME}.manifest.json"

          (
            cd "${DRILL_DIR}/download"
            sha256sum --check "${ARCHIVE_NAME}.sha256"
            sha256sum --check "${MANIFEST_NAME}.sha256"
          )

          python scripts/backup-bundle.py verify \
            --archive "${DRILL_DIR}/download/${ARCHIVE_NAME}" \
            --manifest "${DRILL_DIR}/download/${MANIFEST_NAME}"

          tar -xzf "${DRILL_DIR}/download/${ARCHIVE_NAME}" -C "${DRILL_DIR}/extracted"
          (
            cd "${DRILL_DIR}/extracted"
            sha256sum --check SHA256SUMS
            for required in roles.sql schema.sql data.sql BACKUP_METADATA.txt; do
              test -s "${required}"
            done
          )

          python - \
            "${DRILL_DIR}/download/${MANIFEST_NAME}" \
            "${DRILL_DIR}/download/${ARCHIVE_NAME}" \
            "${GITHUB_OUTPUT}" <<'PY'
          import json
          import os
          import sys

          manifest_path, archive_path, output_path = sys.argv[1:]
          with open(manifest_path, encoding="utf-8") as handle:
              manifest = json.load(handle)

          generated_at = manifest.get("generated_at_utc")
          if not isinstance(generated_at, str) or not generated_at.endswith("Z"):
              raise SystemExit("verified manifest is missing generated_at_utc")

          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"valid_copy_at={generated_at}\n")
              handle.write(f"archive_size={os.path.getsize(archive_path)}\n")
          PY

          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "manifest_name=${MANIFEST_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Restore Production bundle into isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          RESTORE_PROJECT_DIR="${RUNNER_TEMP}/lojasaph-isolated-supabase"
          rm -rf "${RESTORE_PROJECT_DIR}"
          install -d -m 700 "${RESTORE_PROJECT_DIR}"

          pushd "${RESTORE_PROJECT_DIR}" >/dev/null
          supabase init >/dev/null
          install -d -m 700 supabase/.temp
          printf '%s\n' "${SUPABASE_POSTGRES_VERSION}" > supabase/.temp/postgres-version
          printf '%s\n' "${SUPABASE_STORAGE_VERSION}" > supabase/.temp/storage-version

          # Keep the database, Auth and Storage migrations required by a real
          # Supabase logical restore while skipping unrelated UI/observability
          # services to reduce CI resource use. Storage is pinned explicitly:
          # Production has migration 64, while the CLI's older default image
          # does not contain the versioning_status schema restored by data.sql.
          supabase start \
            --exclude postgres-meta,realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor \
            >/dev/null

          STATUS_ENV="$(supabase status -o env 2>/dev/null)"
          BACKUP_RESTORE_DB_URL="$(
            printf '%s\n' "${STATUS_ENV}" \
              | sed -n 's/^DB_URL=//p' \
              | head -n 1 \
              | sed -E 's/^"//; s/"$//'
          )"
          unset STATUS_ENV
          popd >/dev/null

          if [[ -z "${BACKUP_RESTORE_DB_URL}" ]]; then
            echo "::error::Isolated Supabase database URL was not available." >&2
            exit 1
          fi

          STORAGE_MIGRATION="$(
            psql \
              --no-psqlrc \
              --quiet \
              --tuples-only \
              --no-align \
              --variable ON_ERROR_STOP=1 \
              --dbname "${BACKUP_RESTORE_DB_URL}" \
              --command 'select coalesce(max(id), 0) from storage.migrations'
          )"
          if (( STORAGE_MIGRATION < SUPABASE_STORAGE_REQUIRED_MIGRATION )); then
            echo "::error::Isolated Storage schema is migration ${STORAGE_MIGRATION}; Production restore requires at least ${SUPABASE_STORAGE_REQUIRED_MIGRATION}." >&2
            exit 1
          fi

          HAS_VERSIONING_STATUS="$(
            psql \
              --no-psqlrc \
              --quiet \
              --tuples-only \
              --no-align \
              --variable ON_ERROR_STOP=1 \
              --dbname "${BACKUP_RESTORE_DB_URL}" \
              --command "select exists (select 1 from information_schema.columns where table_schema = 'storage' and table_name = 'buckets' and column_name = 'versioning_status')"
          )"
          if [[ "${HAS_VERSIONING_STATUS}" != "t" ]]; then
            echo "::error::Isolated Storage schema is missing storage.buckets.versioning_status." >&2
            exit 1
          fi

          BACKUP_RESTORE_ISOLATED=true \
          BACKUP_RESTORE_DB_URL="${BACKUP_RESTORE_DB_URL}" \
          BACKUP_RESTORE_EXPECTED_PROJECT_REF="${SUPABASE_PROJECT_REF}" \
            bash scripts/restore-production-backup.sh \
              "${RUNNER_TEMP}/lojasaph-backup-drill/extracted"

      - name: Record successful real restore drill
        shell: bash
        run: |
          {
            echo "## Monthly Production bundle restore drill"
            echo
            echo "- Latest real off-site archive: \`${{ steps.latest.outputs.archive_name }}\`"
            echo "- Manifest: \`${{ steps.latest.outputs.manifest_name }}\`"
            echo "- S3-compatible bundle checksums: verified after download"
            echo "- Internal SQL checksums: verified"
            echo "- Production roles/schema/data: restored into isolated Supabase PostgreSQL 17"
            echo "- Public foreign-key data: revalidated after replica-mode import"
            echo "- Critical Lojasaph schema/data/RLS smoke tests: passed"
            echo "- Production database was not restored or mutated"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove local drill material
        if: ${{ always() }}
        shell: bash
        run: |
          RESTORE_PROJECT_DIR="${RUNNER_TEMP}/lojasaph-isolated-supabase"
          if [[ -f "${RESTORE_PROJECT_DIR}/supabase/config.toml" ]]; then
            (
              cd "${RESTORE_PROJECT_DIR}"
              supabase stop --no-backup >/dev/null 2>&1 || true
            )
          fi
          rm -rf "${RUNNER_TEMP}/lojasaph-backup-drill" "${RESTORE_PROJECT_DIR}"

      - name: Finalize successful restore drill
        if: ${{ success() }}
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: |
          bash scripts/record-protection-run.sh success \
            "${{ steps.latest.outputs.valid_copy_at }}" \
            "${{ steps.latest.outputs.archive_size }}"

      - name: Finalize failed restore drill
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: |
          bash scripts/record-protection-run.sh failure \
            "Production PostgreSQL bundle restore drill failed before isolated verification completed."

      - name: Report persistent restore-drill incident
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_INCIDENT_STATUS: failure
          BACKUP_INCIDENT_KEY: backup-restore-drill
          BACKUP_INCIDENT_TITLE: "[backup-alert] Monthly restore drill failing"
          BACKUP_INCIDENT_WORKFLOW: Backup Restore Drill
          BACKUP_INCIDENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKUP_INCIDENT_DETAILS: "Production PostgreSQL bundle restore drill failed in isolated verification; Production was not restored or mutated."
        run: python scripts/sync-backup-incident.py

      - name: Resolve persistent restore-drill incident after recovery
        if: ${{ success() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_INCIDENT_STATUS: success
          BACKUP_INCIDENT_KEY: backup-restore-drill
          BACKUP_INCIDENT_TITLE: "[backup-alert] Monthly restore drill failing"
          BACKUP_INCIDENT_WORKFLOW: Backup Restore Drill
          BACKUP_INCIDENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/sync-backup-incident.py
