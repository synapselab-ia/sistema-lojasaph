name: Backup Restore Drill

on:
  schedule:
    - cron: "43 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backup-restore-drill
  cancel-in-progress: false

env:
  BACKUP_AWS_CLI_IMAGE: amazon/aws-cli:2.36.30
  BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
  BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
  BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
  BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX || 'production/postgres' }}
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: lojasaph
  PATH: /usr/lib/postgresql/17/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  drill:
    if: ${{ vars.BACKUP_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lojasaph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lojasaph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.BACKUP_S3_SESSION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate required drill configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required backup drill configuration for ${name} is not configured."
              missing=1
            fi
          done
          if (( missing != 0 )); then
            exit 1
          fi

          if [[ "${BACKUP_S3_ENDPOINT}" != https://* ]]; then
            echo "::error::BACKUP_S3_ENDPOINT must use HTTPS."
            exit 1
          fi

      - name: Verify S3-compatible tooling
        run: bash scripts/s3-backup-storage.sh check-tooling

      - name: Download and verify latest real off-site backup
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          DRILL_DIR="${RUNNER_TEMP}/lojasaph-backup-drill"
          rm -rf "${DRILL_DIR}"
          install -d -m 700 "${DRILL_DIR}/download" "${DRILL_DIR}/extracted"

          ARCHIVE_NAME="$(
            bash scripts/s3-backup-storage.sh download-latest "${DRILL_DIR}/download"
          )"
          MANIFEST_NAME="${ARCHIVE_NAME}.manifest.json"

          (
            cd "${DRILL_DIR}/download"
            sha256sum --check "${ARCHIVE_NAME}.sha256"
            sha256sum --check "${MANIFEST_NAME}.sha256"
          )

          python scripts/backup-bundle.py verify \
            --archive "${DRILL_DIR}/download/${ARCHIVE_NAME}" \
            --manifest "${DRILL_DIR}/download/${MANIFEST_NAME}"

          tar -xzf "${DRILL_DIR}/download/${ARCHIVE_NAME}" -C "${DRILL_DIR}/extracted"
          (
            cd "${DRILL_DIR}/extracted"
            sha256sum --check SHA256SUMS
            for required in roles.sql schema.sql data.sql BACKUP_METADATA.txt; do
              test -s "${required}"
            done
          )

          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "manifest_name=${MANIFEST_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          ARCH="$(dpkg --print-architecture)"
          cat <<EOF | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: ${ARCH}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update \
            -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/pgdg.sources" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0" \
            -o Acquire::Retries=3 \
            -o Acquire::https::Timeout=30
          sudo apt-get install --yes --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            postgresql-client-17

      - name: Build isolated synthetic source database
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Run isolated restore drill
        run: bash scripts/verify-backup-restore.sh

      - name: Record successful drill
        shell: bash
        run: |
          {
            echo "## Monthly backup restore drill"
            echo
            echo "- Latest real off-site archive: \`${{ steps.latest.outputs.archive_name }}\`"
            echo "- Manifest: \`${{ steps.latest.outputs.manifest_name }}\`"
            echo "- S3-compatible bundle checksums: verified after download"
            echo "- Internal SQL checksums: verified"
            echo "- Isolated PostgreSQL dump/restore regression: passed"
            echo "- Production database was not mutated"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove local drill material
        if: ${{ always() }}
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/lojasaph-backup-drill"

      - name: Report persistent restore-drill incident
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_INCIDENT_STATUS: failure
          BACKUP_INCIDENT_KEY: backup-restore-drill
          BACKUP_INCIDENT_TITLE: "[backup-alert] Monthly restore drill failing"
          BACKUP_INCIDENT_WORKFLOW: Backup Restore Drill
          BACKUP_INCIDENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKUP_INCIDENT_DETAILS: "Monthly isolated restore drill failed; Production was not restored or mutated."
        run: python scripts/sync-backup-incident.py

      - name: Resolve persistent restore-drill incident after recovery
        if: ${{ success() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_INCIDENT_STATUS: success
          BACKUP_INCIDENT_KEY: backup-restore-drill
          BACKUP_INCIDENT_TITLE: "[backup-alert] Monthly restore drill failing"
          BACKUP_INCIDENT_WORKFLOW: Backup Restore Drill
          BACKUP_INCIDENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/sync-backup-incident.py
