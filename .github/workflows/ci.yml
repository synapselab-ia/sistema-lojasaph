name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lojasaph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lojasaph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: lojasaph
      PATH: /usr/lib/postgresql/17/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          ARCH="$(dpkg --print-architecture)"
          cat <<EOF | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: ${ARCH}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17

      - name: Show PostgreSQL client
        run: |
          psql --version
          pg_dump --version
          pg_restore --version

      - name: Validate backup scripts
        run: bash -n scripts/export-supabase-backup.sh scripts/verify-backup-restore.sh

      - name: Bootstrap Supabase auth stubs
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql

      - name: Apply migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Apply anonymized seed
        run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Verify logical backup and isolated restore
        run: bash scripts/verify-backup-restore.sh

      - name: Run schema and RLS smoke tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/schema_smoke.sql

      - name: Run RLS and grant hardening tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/security_hardening.sql

      - name: Run auth role and Organization isolation tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/auth_runtime_roles.sql

      - name: Run transactional withdrawal tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_withdrawal.sql

      - name: Run stock loss and expiration tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_loss.sql

      - name: Run transactional transfer tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_transfer.sql

      - name: Run multi-batch transfer tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_transfer_multibatch.sql

      - name: Run import staging and dry-run tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/import_staging.sql

      - name: Run employee identity and scope tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/employees.sql
