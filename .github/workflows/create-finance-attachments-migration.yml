name: Create finance attachments migration

on:
  push:
    branches: [agent/finance-attachments]
    paths:
      - .github/workflows/create-finance-attachments-migration.yml

permissions:
  contents: write

jobs:
  migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/finance-attachments
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show Supabase CLI help
        run: npx --yes supabase@2.111.0 migration new --help
      - name: Create migration with pinned Supabase CLI
        run: npx --yes supabase@2.111.0 migration new finance_attachments
      - name: Commit migration shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_finance_attachments.sql
          git commit -m "chore: create finance attachments migration"
          git push origin HEAD:agent/finance-attachments
