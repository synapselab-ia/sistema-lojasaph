name: Create inventory ledger alignment migration

on:
  push:
    branches: [agent/inventory-count-runtime]
    paths:
      - .github/workflows/create-inventory-alignment-migration.yml

permissions:
  contents: write

jobs:
  migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inventory-count-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create migration
        run: npx --yes supabase@2.111.0 migration new inventory_count_ledger_alignment
      - name: Commit shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_inventory_count_ledger_alignment.sql
          git commit -m "chore: create inventory ledger alignment migration"
          git push origin HEAD:agent/inventory-count-runtime
