name: Create persistent inventory count migration

on:
  push:
    branches: [agent/inventory-count-runtime]
    paths:
      - .github/workflows/create-inventory-count-migration.yml

permissions:
  contents: write

jobs:
  migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/inventory-count-runtime
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create migration with pinned Supabase CLI
        run: npx --yes supabase@2.111.0 migration new persistent_inventory_count
      - name: Commit migration shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_persistent_inventory_count.sql
          git commit -m "chore: create persistent inventory count migration"
          git push origin HEAD:agent/inventory-count-runtime
