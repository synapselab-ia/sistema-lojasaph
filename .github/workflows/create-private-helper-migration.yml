name: Create Supabase security migration

on:
  push:
    branches: [agent/supabase-adapters]

permissions:
  contents: write

jobs:
  migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/supabase-adapters

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect Supabase CLI
        run: |
          npx --yes supabase@2.111.0 --help >/dev/null
          npx --yes supabase@2.111.0 migration new --help >/dev/null

      - name: Create migration
        run: |
          npx --yes supabase@2.111.0 migration new private_membership_helpers
          FILE=$(ls -1t supabase/migrations/*_private_membership_helpers.sql | head -1)
          cat > "$FILE" <<'SQL'
          create schema if not exists private;
          revoke all on schema private from public;
          revoke all on schema private from anon;
          grant usage on schema private to authenticated, service_role;

          create or replace function private.is_org_member(target_organization_id uuid)
          returns boolean
          language sql
          stable
          security definer
          set search_path = ''
          as $$
            select exists (
              select 1
              from public.organization_memberships membership
              where membership.organization_id = target_organization_id
                and membership.user_id = auth.uid()
                and membership.active
            );
          $$;

          create or replace function private.has_org_role(target_organization_id uuid, allowed_roles text[])
          returns boolean
          language sql
          stable
          security definer
          set search_path = ''
          as $$
            select exists (
              select 1
              from public.organization_memberships membership
              where membership.organization_id = target_organization_id
                and membership.user_id = auth.uid()
                and membership.active
                and membership.role = any(allowed_roles)
            );
          $$;

          revoke all on function private.is_org_member(uuid) from public, anon;
          revoke all on function private.has_org_role(uuid, text[]) from public, anon;
          grant execute on function private.is_org_member(uuid) to authenticated, service_role;
          grant execute on function private.has_org_role(uuid, text[]) to authenticated, service_role;

          create or replace function public.is_org_member(target_organization_id uuid)
          returns boolean
          language sql
          stable
          security invoker
          set search_path = ''
          as $$
            select private.is_org_member(target_organization_id);
          $$;

          create or replace function public.has_org_role(target_organization_id uuid, allowed_roles text[])
          returns boolean
          language sql
          stable
          security invoker
          set search_path = ''
          as $$
            select private.has_org_role(target_organization_id, allowed_roles);
          $$;

          revoke all on function public.is_org_member(uuid) from public, anon;
          revoke all on function public.has_org_role(uuid, text[]) from public, anon;
          grant execute on function public.is_org_member(uuid) to authenticated, service_role;
          grant execute on function public.has_org_role(uuid, text[]) to authenticated, service_role;
          SQL

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_private_membership_helpers.sql
          git commit -m "fix: move membership helpers to private schema"
          git push origin HEAD:agent/supabase-adapters
