name: Create transactional transfer migration

on:
  push:
    branches: [agent/stock-transfer-runtime]
    paths:
      - .github/workflows/create-transfer-migration.yml

permissions:
  contents: write

jobs:
  migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/stock-transfer-runtime
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create migration with pinned Supabase CLI
        run: npx --yes supabase@2.111.0 migration new transactional_stock_transfer
      - name: Commit migration shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_transactional_stock_transfer.sql
          git commit -m "chore: create transactional transfer migration"
          git push origin HEAD:agent/stock-transfer-runtime
