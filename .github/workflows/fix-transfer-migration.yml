name: Fix transfer migration ambiguity

on:
  push:
    branches: [agent/stock-transfer-runtime]
    paths:
      - .github/workflows/fix-transfer-migration.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stock-transfer-runtime
      - name: Qualify received quantity updates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260817224800_transactional_stock_transfer.sql')
          text = path.read_text()
          old1 = '''        update public.stock_transfer_batch_allocations
        set destination_batch_id = v_destination_batch_id,
            received_quantity = received_quantity + v_take
        where id = v_allocation.id
          and organization_id = p_organization_id;'''
          new1 = '''        update public.stock_transfer_batch_allocations allocation
        set destination_batch_id = v_destination_batch_id,
            received_quantity = allocation.received_quantity + v_take
        where allocation.id = v_allocation.id
          and allocation.organization_id = p_organization_id;'''
          old2 = '''        update public.stock_transfer_batch_allocations
        set received_quantity = received_quantity + v_take
        where id = v_allocation.id
          and organization_id = p_organization_id;'''
          new2 = '''        update public.stock_transfer_batch_allocations allocation
        set received_quantity = allocation.received_quantity + v_take
        where allocation.id = v_allocation.id
          and allocation.organization_id = p_organization_id;'''
          if old1 not in text or old2 not in text:
              raise SystemExit('expected transfer update blocks not found')
          path.write_text(text.replace(old1, new1).replace(old2, new2))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260817224800_transactional_stock_transfer.sql
          git commit -m "fix: qualify transfer allocation received quantity"
          git push origin HEAD:agent/stock-transfer-runtime
