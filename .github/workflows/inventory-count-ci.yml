name: Inventory Count Integration

on:
  pull_request:
    paths:
      - "supabase/**"
      - "src/modules/inventory/**"
      - "src/modules/master-data/**"
      - "src/app/workspace/**"
      - ".github/workflows/inventory-count-ci.yml"

permissions:
  contents: read

jobs:
  inventory-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lojasaph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lojasaph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: lojasaph

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Supabase auth stubs
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql

      - name: Apply all migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Apply anonymized seed
        run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Replay existing database suites
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/schema_smoke.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_item_category_required.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/auth_runtime_roles.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_withdrawal.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_withdrawal_sector_scope.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_return.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_transfer.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_transfer_multibatch.sql

      - name: Run persistent inventory count suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/inventory_count.sql
