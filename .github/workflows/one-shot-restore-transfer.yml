name: One-shot restore stock transfer wiring

on:
  push:
    branches: [agent/restore-stock-transfer]
    paths:
      - .github/workflows/one-shot-restore-transfer.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-stock-transfer

      - name: Reconcile transfer wiring with current main
        run: |
          python - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          marker = "      - name: Run transactional withdrawal tests\n        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_withdrawal.sql\n"
          replacement = marker + "\n      - name: Run transactional transfer tests\n        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_transfer.sql\n\n      - name: Run multi-batch transfer tests\n        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_transfer_multibatch.sql\n"
          if marker not in text:
              raise SystemExit('CI withdrawal marker not found')
          ci.write_text(text.replace(marker, replacement, 1))

          shell = Path('src/components/runtime-shell.tsx')
          text = shell.read_text()
          marker = '  { href: "/workspace/estoque", label: "Estoque" },\n];'
          replacement = '  { href: "/workspace/estoque", label: "Estoque" },\n  { href: "/workspace/transferencias", label: "Transferências" },\n  { href: "/workspace/inventarios", label: "Inventários" },\n];'
          if marker not in text:
              raise SystemExit('runtime shell link marker not found')
          text = text.replace(marker, replacement, 1)
          old_status = 'Produtos, fornecedores e entradas desta área usam Supabase + RLS. Retiradas, transferências e inventários continuam na demonstração até receberem comandos transacionais próprios.'
          new_status = 'Produtos, fornecedores, entradas, retiradas, transferências e inventário físico desta área usam Supabase + RLS. Compras evolui em uma fase separada.'
          if old_status not in text:
              raise SystemExit('runtime shell status marker not found')
          shell.write_text(text.replace(old_status, new_status, 1))

          transfer = Path('src/app/workspace/(operacao)/transferencias/page.tsx')
          text = transfer.read_text()
          old = '''      <aside className="rounded-2xl border border-amber-200 bg-amber-50 p-5 text-sm leading-6 text-amber-950">\n        <h2 className="font-semibold">Inventário físico</h2>\n        <p className="mt-1">Inventário ainda permanece fora do workspace persistente. Ele será o próximo fluxo crítico após a homologação desta transferência.</p>\n      </aside>'''
          new = '''      <aside className="rounded-2xl border border-emerald-200 bg-emerald-50 p-5 text-sm leading-6 text-emerald-950">\n        <h2 className="font-semibold">Ledger persistente</h2>\n        <p className="mt-1">Transferências e inventário físico já operam no workspace persistente com commands PostgreSQL transacionais e auditados.</p>\n      </aside>'''
          if old not in text:
              raise SystemExit('transfer page status marker not found')
          transfer.write_text(text.replace(old, new, 1))

          inventory = Path('src/app/workspace/(operacao)/inventarios/page.tsx')
          text = inventory.read_text()
          effect = '''  useEffect(() => {\n    void refresh();\n  }, [refresh]);'''
          replacement = '''  useEffect(() => {\n    let active = true;\n\n    void gateway\n      .list(workspace.organizationId)\n      .then((nextCounts) => {\n        if (active) setCounts(nextCounts);\n      })\n      .catch((error) => {\n        if (active) setMessage(error instanceof Error ? error.message : "Não foi possível carregar os inventários.");\n      })\n      .finally(() => {\n        if (active) setLoading(false);\n      });\n\n    return () => {\n      active = false;\n    };\n  }, [gateway, workspace.organizationId]);'''
          if effect not in text:
              raise SystemExit('inventory effect marker not found')
          inventory.write_text(text.replace(effect, replacement, 1))
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/one-shot-restore-transfer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(inventory): reconcile restored transfer runtime"
          git push origin HEAD:agent/restore-stock-transfer
