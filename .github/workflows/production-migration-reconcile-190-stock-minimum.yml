name: Production Migration Reconcile 190 Stock Minimum

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-migration-reconcile-190-stock-minimum.yml"

permissions:
  contents: read

concurrency:
  group: production-migration-reconcile
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: "2.111.0"
  SUPABASE_PROJECT_REF: fhbvwyttikrbeaanatlr

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Production target
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::PRODUCTION_SUPABASE_DB_URL is not configured."
            exit 1
          fi

          if [[ "${SUPABASE_DB_URL}" != *".pooler.supabase.com:5432/"* ]]; then
            echo "::error::Production migration reconciliation requires the Supabase Session pooler on port 5432."
            exit 1
          fi

          if [[ "${SUPABASE_DB_URL}" != *"${SUPABASE_PROJECT_REF}"* ]]; then
            echo "::error::Production database URL does not identify the expected Supabase project."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify exact pending migration
        shell: bash
        run: |
          set -euo pipefail

          expected="20260914120000_stock_minimum_composition.sql"
          if [[ ! -f "supabase/migrations/${expected}" ]]; then
            echo "::error::Expected migration is missing from the checked-out main branch: ${expected}"
            exit 1
          fi

          dry_run="${RUNNER_TEMP}/production-migration-dry-run.txt"
          supabase db push \
            --dry-run \
            --db-url "${SUPABASE_DB_URL}" \
            --yes 2>&1 | tee "${dry_run}"

          mapfile -t pending < <(
            grep -Eo '[0-9]{14}_[[:alnum:]_.-]+\.sql' "${dry_run}" \
              | sort -u \
              || true
          )

          if (( ${#pending[@]} != 1 )); then
            echo "::error::Expected exactly one pending migration, found ${#pending[@]}."
            printf '  - %s\n' "${pending[@]:-none}"
            exit 1
          fi

          if [[ "${pending[0]}" != "${expected}" ]]; then
            echo "::error::Unexpected pending migration: ${pending[0]} (expected ${expected})."
            exit 1
          fi

          echo "Approved pending migration: ${expected}"

      - name: Apply approved versioned migration
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --db-url "${SUPABASE_DB_URL}" \
            --yes

      - name: Verify no local migration remains pending
        shell: bash
        run: |
          set -euo pipefail
          verification="${RUNNER_TEMP}/production-migration-post-push.txt"
          supabase db push \
            --dry-run \
            --db-url "${SUPABASE_DB_URL}" \
            --yes 2>&1 | tee "${verification}"

          if grep -Eq '[0-9]{14}_[[:alnum:]_.-]+\.sql' "${verification}"; then
            echo "::error::At least one local migration remains pending after reconciliation."
            exit 1
          fi

          if ! grep -Fq 'Remote database is up to date.' "${verification}"; then
            echo "::error::Post-push dry-run did not confirm an up-to-date remote database."
            exit 1
          fi

      - name: Record reconciliation summary
        shell: bash
        run: |
          {
            echo "## Production migration reconciliation — Issue #190 / stock-minimum"
            echo
            echo "- Project: \`${SUPABASE_PROJECT_REF}\`"
            echo "- Allowed migration: \`20260914120000_stock_minimum_composition.sql\`"
            echo "- Mechanism: version-preserving \`supabase db push\`"
            echo "- Seed data: not applied"
            echo "- Production reset/repair: not used"
            echo "- Post-push dry-run: remote up to date"
          } >> "${GITHUB_STEP_SUMMARY}"
