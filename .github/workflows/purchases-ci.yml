name: Business Transactions Integration

on:
  pull_request:
    paths:
      - "supabase/**"
      - "src/modules/purchases/**"
      - "src/modules/finance/**"
      - "src/modules/cash/**"
      - "src/modules/dashboard/**"
      - "src/modules/suppliers/**"
      - "src/modules/inventory/**"
      - "src/modules/master-data/**"
      - "src/app/workspace/**"
      - "src/components/runtime-shell.tsx"
      - ".github/workflows/purchases-ci.yml"

permissions:
  contents: read

jobs:
  business-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lojasaph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lojasaph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: lojasaph
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Supabase auth stubs
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Apply all migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do psql -v ON_ERROR_STOP=1 -f "${migration}"; done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
      - name: Apply anonymized seed
        run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Replay stabilized database suites
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/schema_smoke.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/auth_runtime_roles.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_withdrawal.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_transfer.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_transfer_multibatch.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/inventory_count.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/purchase_orders.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/finance_payables.sql
      - name: Run cash sessions lifecycle suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/cash_sessions.sql
      - name: Run scoped permission suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/scoped_permissions.sql
