name: Purchases Integration

on:
  pull_request:
    paths:
      - "supabase/**"
      - "src/modules/purchases/**"
      - "src/modules/suppliers/**"
      - "src/modules/inventory/**"
      - "src/modules/master-data/**"
      - "src/app/workspace/**"
      - "src/components/runtime-shell.tsx"
      - ".github/workflows/purchases-ci.yml"

permissions:
  contents: read

jobs:
  purchases-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lojasaph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lojasaph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: lojasaph

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Supabase auth stubs
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql

      - name: Apply all migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Apply anonymized seed
        run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Replay stabilized database suites
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/schema_smoke.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/auth_runtime_roles.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_withdrawal.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_transfer.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_transfer_multibatch.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/inventory_count.sql

      - name: Run purchase order lifecycle suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/purchase_orders.sql

  # BEGIN TEMP PURCHASES RUNTIME RECONCILIATION
  reconcile-purchases-runtime:
    if: github.head_ref == 'agent/purchases-runtime' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout purchases branch
        uses: actions/checkout@v4
        with:
          ref: agent/purchases-runtime

      - name: Reconcile permissions, navigation and React effects
        run: |
          python - <<'PY'
          from pathlib import Path

          provider = Path('src/modules/master-data/ui/runtime-workspace-provider.tsx')
          text = provider.read_text()
          if 'readonly managePurchases: boolean;' not in text:
              marker = '  readonly manageStockTransfers: boolean;\n}'
              replacement = '  readonly manageStockTransfers: boolean;\n  readonly managePurchases: boolean;\n  readonly receivePurchases: boolean;\n}'
              if marker not in text:
                  raise SystemExit('runtime permissions interface marker not found')
              text = text.replace(marker, replacement, 1)
          if 'managePurchases: can(roles' not in text:
              marker = '    manageStockTransfers: can(roles, ["owner", "admin", "manager", "inventory"]),\n  };'
              replacement = '    manageStockTransfers: can(roles, ["owner", "admin", "manager", "inventory"]),\n    managePurchases: can(roles, ["owner", "admin", "manager", "purchases"]),\n    receivePurchases: can(roles, ["owner", "admin", "manager", "purchases", "inventory"]),\n  };'
              if marker not in text:
                  raise SystemExit('runtime permissions assignment marker not found')
              text = text.replace(marker, replacement, 1)
          provider.write_text(text)

          shell = Path('src/components/runtime-shell.tsx')
          text = shell.read_text()
          if 'href: "/workspace/compras"' not in text:
              marker = '  { href: "/workspace/inventarios", label: "Inventários" },\n];'
              replacement = '  { href: "/workspace/inventarios", label: "Inventários" },\n  { href: "/workspace/compras", label: "Compras" },\n];'
              if marker not in text:
                  raise SystemExit('runtime shell navigation marker not found')
              text = text.replace(marker, replacement, 1)
          old = 'Produtos, fornecedores, entradas, retiradas, transferências e inventário físico desta área usam Supabase + RLS. Compras evolui em uma fase separada.'
          if old in text:
              text = text.replace(old, 'Estoque e compras desta área usam Supabase + RLS e commands PostgreSQL transacionais. Financeiro e caixa ainda evoluem separadamente.', 1)
          shell.write_text(text)

          page = Path('src/app/workspace/(operacao)/compras/page.tsx')
          text = page.read_text()
          if 'const organizationId = workspace.organizationId;' not in text:
              old = '''  const refreshOrders = useCallback(async () => {\n    setLoading(true);\n    try {\n      setOrders(await gateway.listOrders(workspace.organizationId));\n    } catch (error) {\n      setMessage(workspace.errorMessage(error));\n    } finally {\n      setLoading(false);\n    }\n  }, [gateway, workspace]);\n\n  useEffect(() => { void refreshOrders(); }, [refreshOrders]);\n\n  useEffect(() => {\n    if (!supplierId) {\n      setSupplierItems([]);\n      setDraftItems({});\n      return;\n    }'''
              new = '''  const organizationId = workspace.organizationId;\n\n  const refreshOrders = useCallback(async () => {\n    setLoading(true);\n    try {\n      setOrders(await gateway.listOrders(organizationId));\n    } catch (error) {\n      setMessage(error instanceof Error ? error.message : "Não foi possível carregar os pedidos.");\n    } finally {\n      setLoading(false);\n    }\n  }, [gateway, organizationId]);\n\n  useEffect(() => {\n    let active = true;\n    void gateway\n      .listOrders(organizationId)\n      .then((nextOrders) => {\n        if (active) setOrders(nextOrders);\n      })\n      .catch((error) => {\n        if (active) setMessage(error instanceof Error ? error.message : "Não foi possível carregar os pedidos.");\n      })\n      .finally(() => {\n        if (active) setLoading(false);\n      });\n    return () => { active = false; };\n  }, [gateway, organizationId]);\n\n  useEffect(() => {\n    if (!supplierId) return;'''
              if old not in text:
                  raise SystemExit('purchase effects marker not found')
              text = text.replace(old, new, 1)
          page.write_text(text)
          PY

      - name: Commit reconciled runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/master-data/ui/runtime-workspace-provider.tsx src/components/runtime-shell.tsx 'src/app/workspace/(operacao)/compras/page.tsx'
          git commit -m "feat(purchases): wire authenticated runtime"
          git push origin HEAD:agent/purchases-runtime
  # END TEMP PURCHASES RUNTIME RECONCILIATION
