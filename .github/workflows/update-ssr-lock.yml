name: Update SSR lockfile

on:
  push:
    branches: [agent/auth-runtime]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/auth-runtime
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git status --porcelain -- package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: update npm lockfile for supabase ssr"
            git push origin HEAD:agent/auth-runtime
          fi
