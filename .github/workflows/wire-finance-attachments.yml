name: Wire finance attachments panel

on:
  push:
    branches: [agent/finance-attachments]
    paths:
      - .github/workflows/wire-finance-attachments.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-attachments
      - name: Patch finance page
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/app/workspace/(operacao)/financeiro/page.tsx")
          text = path.read_text()
          old_import = '''import {
            FinanceState,
            InstallmentPaymentStatus,
            RuntimeInstallmentSummary,
            SupabaseFinanceGateway,
          } from "@/modules/finance/adapters/supabase-finance-gateway";
          import { useRuntimeWorkspace } from "@/modules/master-data/ui/runtime-workspace-provider";'''
          new_import = old_import + '\nimport { FinanceAttachmentsPanel } from "@/modules/finance/ui/finance-attachments-panel";'
          if old_import not in text:
              raise SystemExit("finance import anchor not found")
          text = text.replace(old_import, new_import, 1)

          anchor = '''              </div>\n\n              <div className="divide-y divide-neutral-100">'''
          panel = '''              </div>\n\n              <FinanceAttachmentsPanel\n                organizationId={organizationId}\n                payableDocumentId={document.id}\n                canUpload={workspace.permissions.manageFinance && document.lifecycleStatus === "active"}\n              />\n\n              <div className="divide-y divide-neutral-100">'''
          if anchor not in text:
              raise SystemExit("finance article anchor not found")
          text = text.replace(anchor, panel, 1)
          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/workspace/(operacao)/financeiro/page.tsx'
          git commit -m "feat(finance): surface private attachments"
          git push origin HEAD:agent/finance-attachments
